services:
  mysql80:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports: ["127.0.0.1:33080:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest"]
      interval: 2s
      retries: 60
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports: ["127.0.0.1:33084:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest"]
      interval: 2s
      retries: 60

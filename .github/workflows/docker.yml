# main 푸시마다 테스트 → 제품 버전(vX.Y.N) 계산 → 그 버전으로 Docker 이미지를 빌드해 GHCR 에 올림 → 마지막에 태그·Release 생성.
# 버전 규칙은 scripts/next-version.mjs 참고 (같은 커밋 재실행이면 그 커밋의 태그를 다시 쓴다).
# image·release 잡은 원격 v<버전> 태그가 다른 커밋을 가리키면 실패한다 (다른 커밋이 먼저 출시한 버전을 덮어쓰지 않게).
# 문서만 바뀐 푸시는 실행하지 않는다(paths-ignore). 사람이 직접 v* 태그를 푸시하면 그 태그 버전으로 빌드한다.
# 기능 브랜치에서 workflow_dispatch 로 돌리면 test 잡만 돈다 (정식 태그·Release·이미지를 만들지 않는다).
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# 기본은 읽기 전용. 쓰기 권한은 필요한 잡에서만 올린다
permissions:
  contents: read

# main·태그 실행만 하나의 그룹으로 묶어 버전 계산·태그 생성이 겹치지 않게 한다.
# (기능 브랜치 수동 실행은 test 만 돌므로 별도 그룹 — 대기 중인 릴리스 실행을 밀어내지 않게)
# 실행 중인 것은 취소하지 않지만, 대기 실행은 그룹당 하나만 유지되어 연속 푸시 중 중간 것은 건너뛸 수 있다
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'docker-release' || format('docker-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 계산만 한다 (태그는 이미지가 올라간 뒤 release 잡에서 만든다)
  version:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_exists: ${{ steps.v.outputs.tag_exists }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: v
        name: 버전 계산 (태그 푸시면 그 태그, 이 커밋에 태그가 있으면 재사용, 아니면 다음 패치)
        run: |
          node scripts/next-version.mjs --self-test
          out="$(node scripts/next-version.mjs --github-output)"
          echo "${out}" >> "$GITHUB_OUTPUT"
          printf '제품 버전 계산 결과\n\n```\n%s\n```\n' "${out}" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: version
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # "실패한 잡만 재실행" 이면 그사이 다른 커밋이 같은 버전을 출시했을 수 있어 원격 태그를 다시 읽는다.
      # v<버전> 이 다른 커밋을 가리키면 push 전에 실패하고, :X.Y 는 이 버전이 그 X.Y 의 최신 패치일 때만 붙인다
      - id: tag
        name: 버전 태그 검증 · X.Y 태그 판정
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out="$(node scripts/next-version.mjs --check-tag)" || { echo "${out}"; exit 1; }
          echo "${out}" >> "$GITHUB_OUTPUT"
      # latest 판정은 이 잡에서 다시 한다 ("실패한 잡만 재실행" 때 앞선 판정이 낡았을 수 있음)
      - id: head
        name: 이 커밋이 지금 origin/main HEAD 인지
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${main_sha}" = "${GITHUB_SHA}" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # semver 태그가 latest 를 자동으로 붙이지 않게 끈다 (기본 flavor latest=auto)
          flavor: latest=false
          # latest 는 이 커밋이 지금 origin/main HEAD 일 때만 (오래된 run 재실행·옛 태그 푸시가 latest 를 되돌리지 않게)
          # X.Y 는 이 버전이 원격 vX.Y.* 중 가장 큰 패치 이상일 때만. X.Y.Z 와 sha 태그는 항상
          tags: |
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' && steps.head.outputs.latest == 'true' }}
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ steps.tag.outputs.minor_latest == 'true' }}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 이미지가 올라간 뒤에만 태그·Release 를 만든다. 재실행해도 이미 있는 태그·Release 는 건너뛴다
  release:
    needs: [version, image]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: 버전 태그 검증 (다른 커밋에 있으면 중단)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/next-version.mjs --check-tag
      - name: 태그 만들기 (이미 있으면 건너뜀)
        if: needs.version.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # "실패한 잡만 재실행" 이면 앞선 시도에서 태그를 이미 푸시했을 수 있어 원격을 다시 확인한다
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "v${VERSION} 태그가 이미 있습니다"
          else
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git push origin "v${VERSION}"
          fi
      - name: Release 만들기 (이미 있으면 건너뜀)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release view "v${VERSION}" > /dev/null 2>&1 \
            || gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --generate-notes
